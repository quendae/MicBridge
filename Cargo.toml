[workspace]
resolver = "2"
members = [
    "crates/mb-proto",
    "crates/mb-audio",
    "crates/mb-engine",
    "crates/mb-app",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quendae/MicBridge"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
ciborium = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cpal = "0.15"
clap = { version = "4.5", features = ["derive"] }
ringbuf = "0.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
