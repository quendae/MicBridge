name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # cpal links against ALSA on Linux even when the runtime path is
      # PipeWire, so those headers are needed to build at all. libpipewire and
      # libclang are for the virtual source: pipewire-rs generates its bindings
      # at build time. cmake builds the vendored libopus. GTK and the app
      # indicator are for the tray icon in the window build.
      - name: Zależności systemowe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libasound2-dev libpipewire-0.3-dev libclang-dev pkg-config libgtk-3-dev libayatana-appindicator3-dev libxkbcommon-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # -D warnings goes here rather than in RUSTFLAGS: as an env var it also
      # applies to dependencies, so a new compiler warning in a crate we do not
      # own would break the build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testy
        run: cargo test --workspace

      # Nothing here opens a sound card, so the runner needs no audio hardware.
      - name: Build release
        run: cargo build --workspace --release

  # Ubuntu LTS niesie PipeWire sprzed kilku wydań, a pipewire-rs generuje
  # wiązania z nagłówków systemu — na świeższym PipeWire to samo źródło potrafi
  # się nie skompilować. Ten przebieg jest jedynym, który to wyłapie, i powstał
  # dlatego, że raz nie wyłapał.
  arch:
    name: arch (świeży PipeWire)
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Zależności systemowe
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel cmake git alsa-lib pipewire clang rustup gtk3 libayatana-appindicator libxkbcommon

      - uses: actions/checkout@v5

      - name: Toolchain
        run: rustup default stable

      - name: Wersja PipeWire
        run: pkg-config --modversion libpipewire-0.3

      - name: Testy
        run: cargo test --workspace

      - name: Build release
        run: cargo build --workspace --release

  # Suma archiwum w PKGBUILD jest przypinana ręcznie po wystawieniu tagu, bo
  # wcześniej nie ma czego liczyć. Dotąd nikt jej nie sprawdzał: krok
  # `makepkg --printsrcinfo` w przepisie na paczki tylko parsuje plik i źródła
  # nie pobiera, więc suma z poprzedniego wydania przechodziła na zielono.
  # Skoro świadomie nie ma tu `SKIP`, to musi być co ją weryfikuje.
  suma-pkgbuild:
    name: suma archiwum w PKGBUILD
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Porównaj z archiwum wydania
        run: |
          set -euo pipefail
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          chce=$(sed -n "s/^sha256sums=('\(.*\)')/\1/p" packaging/arch/PKGBUILD)
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/v${pkgver}.tar.gz"

          # Między podbiciem wersji a wystawieniem tagu archiwum jeszcze nie
          # istnieje. To normalny stan gałęzi, nie usterka.
          if ! curl -fsSL -o archiwum.tar.gz "$url"; then
            echo "::notice::tagu v${pkgver} jeszcze nie ma — nie ma czego sprawdzać"
            exit 0
          fi

          mam=$(sha256sum archiwum.tar.gz | cut -d' ' -f1)
          if [ "$mam" != "$chce" ]; then
            echo "::error::PKGBUILD podaje sumę ${chce}, a archiwum v${pkgver} ma ${mam}"
            exit 1
          fi
          echo "suma zgadza się z archiwum v${pkgver}"
