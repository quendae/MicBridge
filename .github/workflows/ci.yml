name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # cpal links against ALSA on Linux even when the runtime path is
      # PipeWire, so the headers are needed to build at all.
      - name: Zależności systemowe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # -D warnings goes here rather than in RUSTFLAGS: as an env var it also
      # applies to dependencies, so a new compiler warning in a crate we do not
      # own would break the build.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Testy
        run: cargo test --workspace

      # Nothing here opens a sound card, so the runner needs no audio hardware.
      - name: Build release
        run: cargo build --workspace --release
