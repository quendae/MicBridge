[package]
name = "mb-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mb-i18n = { path = "../mb-i18n" }
mb-proto = { path = "../mb-proto" }
anyhow.workspace = true
tracing.workspace = true
# Czysty Rust z własnym stosem mDNS. Popularniejszy `zeroconf` deleguje do
# Avahi i Bonjour, czyli kazałby użytkownikowi Windows doinstalować usługę
# Apple'a — jedna zależność za dużo dla programu, którego całą obietnicą jest
# „zainstaluj i działa”.
mdns-sd = "0.21"
gethostname = "1.0"
serde.workspace = true
ciborium.workspace = true
# SPAKE2: krótki kod da się bezpiecznie zamienić na wspólny klucz tylko wtedy,
# gdy podsłuchujący nie może go łamać offline. To jest dokładnie ta własność.
spake2 = "0.4"
# Noise zdejmuje z nas projektowanie uzgadniania kluczy sesji.
snow = "0.10"
chacha20poly1305 = "0.10"
rand = "0.8"
sha2 = "0.10"
dirs = "6.0"
hex = "0.4"
toml = "0.8"
