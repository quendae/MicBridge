[package]
name = "mb-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "micbridge-gui"
path = "src/main.rs"

[dependencies]
mb-app = { path = "../mb-app" }
mb-audio = { path = "../mb-audio" }
mb-net = { path = "../mb-net" }
mb-proto = { path = "../mb-proto" }
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
eframe = { version = "0.32", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }

# Ikona w zasobniku. Bez domyślnych cech, bo ciągną libxdo — biblioteka do
# symulowania klawiatury, której do ikony nie potrzebujemy, a która jest
# kolejnym pakietem do doinstalowania w Linuksie.
tray-icon = { version = "0.24", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# W Linuksie ikona żyje w pętli GTK, osobnej od pętli okna.
gtk = "0.18"
