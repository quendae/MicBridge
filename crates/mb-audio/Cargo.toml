[package]
name = "mb-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mb-i18n = { path = "../mb-i18n" }
mb-proto = { path = "../mb-proto" }
anyhow.workspace = true
cpal.workspace = true
tracing.workspace = true

# Windows dostaje wirtualne wejście od cudzego sterownika (§4 architektury),
# w Linuksie tworzymy własny węzeł i dlatego zależność jest tylko tutaj.
[target.'cfg(target_os = "linux")'.dependencies]
# v0_3_49 odsłania Buffer::requested() — bez tego nie wiadomo, ile ramek graf
# faktycznie chce w tym cyklu. PipeWire 0.3.49 jest z 2022 roku, więc próg
# niczego realnego nie odcina.
pipewire = { version = "0.10", features = ["v0_3_49"] }
